<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Packages</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
<div class="container">
    <div class="box">

    <h1>Package Details</h1>
    <div class="search-section">
        <label for="packId">Enter Package ID</label>
        <input type="number" id="packId" name="package_id">
        <br><br>
        <button onclick="getPackDetails()">Search</button>
        <button onclick="deletePack()">Delete</button>
        <a href="http://localhost:8080/packages"><button>All Packages</button></a>.
    </div>
</div>
    <br><br>
    <div class="box">
        <div id="packDetails" class="pack-details">
            <p><label>Package ID:</label><span id="displayPackId"></span></p>
            <p><label>Order ID:</label> <span id="orderId"></span></p>
            <p><label>Order Date:</label> <span id="orderDate"></span></p>
            <p><label>Quantity:</label> <span id="quantity"></span></p>
            <p><label>Package Date:</label> <span id="packDate"></span></p>
            <p><label>Status:</label> <span id="status"></span></p>
        </div>

        <h2>Package Items</h2>
        <fieldset>
            <legend>Item Details</legend>
            <table>
                <thead>
                <tr>
                    <th>Item ID</th>
                    <th>Quantity</th>
                    <th>Amount</th>
                </tr>
                </thead>

                <tbody id="itemsTable">
                </tbody>
            </table>
        </fieldset>

        <br><br>

        <a href="./packaging.html"><button>Create New Package</button></a>.


    </div>
</div>


<script>
    async function getPackDetails() {
        const packId = parseInt(document.getElementById("packId").value);
        if (!packId) {
            alert("Enter Package ID")
            return;
        }
        try {
            const response = await fetch(
                `http://localhost:8080/packages/${packId}`
            );

            if (!response.ok) {
                throw new Error("Package not found");
            }

            const order=await response.json();

            document.getElementById("displayPackId").textContent = order.package_id;
            document.getElementById("orderId").textContent =order.order_id;
            document.getElementById("orderDate").textContent =order.order_date;
            document.getElementById("quantity").textContent =order.quantity;
            document.getElementById("packDate").textContent =order.package_date;
            document.getElementById("status").textContent =order.status;

            const tableBody = document.getElementById("itemsTable");

            order.items.forEach(item => {

                const row = document.createElement("tr");

                row.innerHTML = `
                <td>${item.item_id}</td>
                <td>${item.item_quantity}</td>
                <td>₹${item.amount}</td>
                `;
                tableBody.appendChild(row);
            });

        }
        catch (error) {
            console.error("Error:", error);
            alert("Unable to retrieve order details: " + error.message);
        }
    }

    async function deletePack() {
        const packId = parseInt(document.getElementById("packId").value);
        if (!packId) {
            alert("Enter Package ID")
            return;
        }
        try {
            const response = await fetch(
                `http://localhost:8080/packages/${packId}`,{
                    method:"DELETE"
                }
            );

            if (!response.ok) {
                throw new Error("Package not found");
            }
            else{
                alert("successfully deleted");
            }

        }
        catch (error) {
            console.error("Error:", error);
            alert("Unable to delete Package: " + error.message);
        }
    }

</script>

</body>
</html>
