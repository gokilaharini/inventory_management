<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Items</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
<div class="container">
    <div class="box">

        <h1>Item Details</h1>
        <div class="search-section">
            <label for="itemId">Enter Item ID</label>
            <input type="number" id="itemId" name="item_id">

            <br><br>
            <button onclick="getItemDetails()">Search Item</button>
            <button onclick="deleteItem()">Delete</button>
            <button onclick="loadAll()">Refresh</button>
        </div>
    </div>
    <br><br>
    <div class="box">
        <h2>Item List</h2>
        <fieldset>
            <legend>Item Details</legend>
            <table>
                <thead>
                <tr>
                    <th>Item ID</th>
                    <th>Name</th>
                    <th>Weight</th>
                    <th>Stock on Hand</th>
                    <th>Committed Stock</th>
                    <th>Available Stock</th>
                    <th>Cost Price</th>
                    <th>Selling Price</th>
                </tr>
                </thead>
                <tbody id="listTable"></tbody>
            </table>
        </fieldset>
    </div>
</div>


<script>
    async function loadAll() {
        try {
            const response = await fetch('http://localhost:8080/items');
            if (!response.ok){
                throw new Error('Failed to fetch items');
            }
            const items = await response.json();
            const tbody = document.getElementById('listTable');
            tbody.innerHTML = '';
            items.forEach(item => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${item.itemId}</td>
                    <td>${item.name}</td>
                    <td>${item.weight}</td>
                    <td>${item.stockOnHand}</td>
                    <td>${item.committedStock}</td>
                    <td>${item.availableStock}</td>
                    <td>₹${item.costPrice}</td>
                    <td>₹${item.sellingPrice}</td>`;
                tbody.appendChild(row);
            });
        } catch (error) {
            console.error('Error:', error);
            alert('Unable to load items: ' + error.message);
        }
    }
    document.addEventListener('DOMContentLoaded', loadAll);
    async function getItemDetails() {
        const itemId = parseInt(document.getElementById("itemId").value);
        if (!itemId) {
            alert("Enter Item ID")
            return;
        }
        try {
            const response = await fetch(
                `http://localhost:8080/items/${itemId}`
            );

            if (!response.ok) {
                throw new Error("Item not found");
            }

            const tbody = document.getElementById('listTable');
            tbody.innerHTML = '';
            const item=await response.json();

            const row = document.createElement('tr');
            row.innerHTML = `
                    <td>${item.itemId}</td>
                    <td>${item.name}</td>
                    <td>${item.weight}</td>
                    <td>${item.stockOnHand}</td>
                    <td>${item.committedStock}</td>
                    <td>${item.availableStock}</td>
                    <td>₹${item.costPrice}</td>
                    <td>₹${item.sellingPrice}</td>`;
            tbody.appendChild(row);

        }
        catch (error) {
            console.error("Error:", error);
            alert("Unable to retrieve Item details: " + error.message);
        }
    }

    async function deleteItem() {
        const itemId = parseInt(document.getElementById("itemId").value);
        if (!itemId) {
            alert("Enter Item ID")
            return;
        }
        try {
            const response = await fetch(
                `http://localhost:8080/items/${itemId}`,{
                    method:"DELETE"
                }
            );

            if (!response.ok) {
                throw new Error("Item not found");
            }
            else{
                alert("successfully deleted");
            }
        }
        catch (error) {
            console.error("Error:", error);
            alert("Unable to delete Item: " + error.message);
        }
    }

</script>

</body>
</html>
