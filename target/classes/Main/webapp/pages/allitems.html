<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>All Items</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="container">
    <div class="box">
        <h1>All Items</h1>
        <div class="search-section">
            <button onclick="loadAll()">Refresh</button>
            <a href="./getItems.html"><button>Search by ID</button></a>
            <a href="./items.html"><button>Create New Item</button></a>
        </div>
    </div>
    <br><br>
    <div class="box">
        <h2>Item List</h2>
        <fieldset>
            <legend>Item Details</legend>
            <table>
                <thead>
                <tr>
                    <th>Item ID</th>
                    <th>Name</th>
                    <th>Weight</th>
                    <th>Stock on Hand</th>
                    <th>Committed Stock</th>
                    <th>Available Stock</th>
                    <th>Cost Price</th>
                    <th>Selling Price</th>
                </tr>
                </thead>
                <tbody id="listTable"></tbody>
            </table>
        </fieldset>
    </div>
</div>

<script>
    async function loadAll() {
        try {
            const response = await fetch('http://localhost:8080/items');
            if (!response.ok) throw new Error('Failed to fetch items');
            const items = await response.json();
            const tbody = document.getElementById('listTable');
            tbody.innerHTML = '';
            items.forEach(item => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${item.itemId}</td>
                    <td>${item.name}</td>
                    <td>${item.weight}</td>
                    <td>${item.stockOnHand}</td>
                    <td>${item.committedStock}</td>
                    <td>${item.availableStock}</td>
                    <td>₹${item.costPrice}</td>
                    <td>₹${item.sellingPrice}</td>`;
                tbody.appendChild(row);
            });
        } catch (error) {
            console.error('Error:', error);
            alert('Unable to load items: ' + error.message);
        }
    }
    document.addEventListener('DOMContentLoaded', loadAll);
</script>

</body>
</html>
